<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b40"><title>四肢物理實驗｜PlayFormosa</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="/games/long-jump/">← 回原版</a><h1>四肢物理實驗 <span>試玩原型</span></h1><div class="tools"><button id="reset" aria-label="重新開始">↻</button><button id="pause" aria-label="暫停">Ⅱ</button></div></header>
<main><section id="arena" aria-label="獨立跳遠物理原型"><div id="scene"></div><div class="hud"><div><span id="phase">準備</span><strong id="speed">0.0 <small>km/h</small></strong></div><div class="energy"><span>體力 <b id="energy-value">100%</b></span><div role="progressbar" id="energy-meter" aria-label="體力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="energy-fill"></i></div><small class="best">原型最佳 <b id="best">—</b></small></div></div><div id="signal" aria-live="polite"></div></section>
<section class="controls" aria-label="五個獨立控制"><div class="pair legs"><button data-action="2"><kbd>A</kbd><span>左腳</span></button><button data-action="3"><kbd>S</kbd><span>右腳</span></button></div><button data-action="4" class="jump"><kbd>Space</kbd><span>蓄力起跳</span></button><div class="pair arms"><button data-action="0"><kbd>J</kbd><span>左手</span></button><button data-action="1"><kbd>K</kbd><span>右手</span></button></div></section></main>
<dialog id="dialog" aria-labelledby="dialog-title"><span class="prototype">獨立試玩原型</span><h2 id="dialog-title">讓四肢自己說話。</h2><div id="dialog-content"><p><b>A／S</b> 左右腳</p><p><b>J／K</b> 左右手</p><p><b>Space</b> 按住蓄力、放開起跳</p><small>手腳按住彎曲，放開伸展。</small></div><button id="start" autofocus>開始試玩 ↗</button></dialog>
<script type="module" src="game.mjs"></script></body></html>
