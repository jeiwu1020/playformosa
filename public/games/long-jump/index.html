<!doctype html><html lang="zh-Hant" data-layout="side"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172c3b"><title>四肢各有想法－跳遠｜PlayFormosa</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="/" aria-label="回到島遊無界">← <span>PLAYFORMOSA</span></a><h1>四肢各有想法－跳遠</h1><nav aria-label="遊戲操作"><button id="sound" aria-label="切換音效" aria-pressed="true">♪</button><button id="reset" aria-label="重新開始">↻</button><button id="pause" aria-label="暫停">Ⅱ</button></nav></header>
<main><section class="arena" aria-label="跳遠遊戲"><div id="scene"></div><div class="hud"><strong id="speed"><span class="speed-caption">助跑速度</span>0.0 <small>km/h</small></strong><div class="record">最佳 <strong id="best">—</strong></div></div><div class="world-hud"><strong id="place-name">台北出發</strong><span id="travel-distance">冒險里程 約 0.0 km</span><span id="wind-label">氣流 →</span></div><div id="place-cue" role="status" aria-live="polite"></div><div class="world-note">里程為航線估算，非台北直線距離；太空科幻・航段依地標命名</div><div id="air-guide" aria-label="續飛體力"><span id="air-count">四肢準備中</span></div></section><section class="controls" aria-label="四肢控制"><div class="limbs body-left"><button data-limb="0"><kbd>J</kbd><span>左手</span><small id="hint-0">擺動平衡</small></button><button data-limb="2"><kbd>A</kbd><span>左腳</span><small id="hint-2">短按邁步</small></button></div><div class="limbs body-right"><button data-limb="1"><kbd>K</kbd><span>右手</span><small id="hint-1">擺動平衡</small></button><button data-limb="3"><kbd>S</kbd><span>右腳</span><small id="hint-3">短按邁步</small></button></div></section></main>
<dialog id="overlay" class="card" aria-labelledby="card-title"><h2 id="card-title">四肢各有想法－跳遠</h2><div id="card-text"><p class="basic-rule"><b>A／S</b> 左右腳　<b>J／K</b> 左右手</p><p class="basic-rule">腳短按跑步；長按後放開起跳</p><p class="basic-rule">空中擺動續飛<br><span>重新長按腳，準備落地</span></p><p class="route-rule">台北出發 → 台灣22縣市 → 環球 → 太空</p></div><div id="share-actions" hidden><div class="share-buttons"><button id="share-result">Threads 文字＋網址 ↗</button><button id="save-result" disabled>儲存圖片</button><button id="copy-result">複製成績與網址</button></div><p id="share-status" role="status" aria-live="polite"></p></div><button id="start" autofocus>開始 ↗</button></dialog>
<script type="module" src="layout.mjs"></script><script type="module" src="game.mjs"></script></body></html>
