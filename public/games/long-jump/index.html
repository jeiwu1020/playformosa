<!doctype html><html lang="zh-Hant" data-layout="side"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172c3b"><title>四肢各有想法－跳遠｜PlayFormosa</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="/" aria-label="回到島遊無界">← <span>PLAYFORMOSA</span></a><h1>四肢各有想法－跳遠</h1><nav aria-label="遊戲操作"><button id="reset" aria-label="重新開始">↻</button><button id="pause" aria-label="暫停">Ⅱ</button></nav></header>
<main><section class="arena" aria-label="跳遠遊戲"><div id="scene"></div><div class="hud"><strong id="speed">0.0 <small>km/h</small></strong><div class="record">最佳 <strong id="best">—</strong></div></div><div id="air-guide" aria-label="剩餘體力"><span id="air-count">體力 100%</span></div></section><section class="controls" aria-label="四肢與起跳控制"><div class="limbs legs"><button data-limb="2"><kbd>A</kbd><span>左腳</span></button><button data-limb="3"><kbd>S</kbd><span>右腳</span></button></div><div class="limbs arms"><button data-limb="0"><kbd>J</kbd><span>左手</span></button><button data-limb="1"><kbd>K</kbd><span>右手</span></button></div><div class="limbs jump-group"><button data-limb="4" class="jump-action" aria-label="Space 按住蓄力，放開起跳"><kbd>Space</kbd><span id="jump-label">蓄力起跳</span></button></div></section></main>
<dialog id="overlay" class="card" aria-labelledby="card-title"><h2 id="card-title">四肢各有想法－跳遠</h2><div id="card-text"><p class="basic-rule"><b>A／S</b> 左右腳</p><p class="basic-rule"><b>J／K</b> 左右手</p><p class="basic-rule"><b>Space</b> 按住蓄力、放開起跳<br><span>空中重新按住準備落地</span></p></div><div id="share-actions" hidden><div class="share-buttons"><button id="share-result">Threads 文字＋網址 ↗</button><button id="save-result" disabled>儲存圖片</button><button id="copy-result">複製成績與網址</button></div><p id="share-status" role="status" aria-live="polite"></p></div><button id="start" autofocus>開始 ↗</button></dialog>
<script type="module" src="layout.mjs"></script><script type="module" src="game.mjs"></script></body></html>
