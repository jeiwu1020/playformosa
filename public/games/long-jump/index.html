<!doctype html><html lang="zh-Hant" data-layout="side"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172c3b"><title>四肢各有想法｜PlayFormosa</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="/" aria-label="回到島遊無界">← <span>PLAYFORMOSA</span></a><h1>四肢各有想法</h1><nav aria-label="遊戲操作"><button id="reset" aria-label="重新開始">↻</button><button id="pause" aria-label="暫停">Ⅱ</button></nav></header>
<main><section class="arena" aria-label="跳遠遊戲"><div id="scene"></div><div class="hud"><strong id="speed">0.0 <small>km/h</small></strong><div class="record">最佳 <strong id="best">—</strong></div></div><div id="air-guide" aria-label="滑翔剩餘次數"><span id="air-count">○ ○</span></div></section><section class="controls" aria-label="四肢控制"><div class="limbs legs"><button data-limb="2"><kbd>A</kbd><span>左腳</span></button><button data-limb="3"><kbd>S</kbd><span>右腳</span></button></div><div class="limbs arms"><button data-limb="0"><kbd>J</kbd><span>左手</span></button><button data-limb="1"><kbd>K</kbd><span>右手</span></button></div></section></main>
<dialog id="overlay" class="card" aria-labelledby="card-title"><h2 id="card-title">四肢各有想法</h2><div id="card-text">AS 雙腳 · JK 雙手</div><div id="share-actions" hidden><div class="share-buttons"><button id="share-result">分享到 Threads ↗</button><button id="save-result" disabled>儲存圖片</button></div><p id="share-status" role="status" aria-live="polite"></p></div><button id="start" autofocus>開始 ↗</button></dialog>
<script type="module" src="layout.mjs"></script><script type="module" src="game.mjs"></script></body></html>
