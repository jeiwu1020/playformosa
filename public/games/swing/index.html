    <style id="pf-startup-style">html[data-pf-startup]:not([data-pf-startup="ready"]) body>:not(#pf-startup):not(script):not(style){visibility:hidden!important}#pf-startup{position:fixed;inset:0;z-index:2147483647;display:flex;overflow:auto;box-sizing:border-box;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));background:#f6f1df;color:#243e38;font:16px/1.6 Arial,'Noto Sans TC',system-ui,sans-serif;text-align:center}#pf-startup .pf-loading-card{box-sizing:border-box;width:min(100%,440px);flex:none;margin:auto;padding:22px 22px 16px;border:2px solid #294c40;border-radius:24px;background:#fff9e8;box-shadow:0 7px 0 #d7dfc8}#pf-startup .pf-loading-brand{margin:0;color:#667969;font-size:11px;font-weight:700;letter-spacing:2px}#pf-startup .pf-loading-art{display:block;width:170px;height:132px;margin:12px auto 4px;overflow:visible}#pf-startup .pf-loading-person{transform-origin:90px 112px;animation:pf-loading-warmup 1.6s ease-in-out infinite}#pf-startup .pf-loading-badge{display:inline-block;margin:0 0 9px;padding:2px 11px;border:1px solid #b3c3ab;border-radius:999px;background:#e6efd6;font-size:12px;font-weight:700;letter-spacing:1px}#pf-startup #pf-startup-status{margin:0;font-size:21px;line-height:1.45;font-weight:800}#pf-startup .pf-loading-joke{margin:9px 0 18px;color:#526c5b;font-size:15px;line-height:1.7;overflow-wrap:anywhere}#pf-startup nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;border-top:1px dashed #bdc9b8;padding-top:12px;margin-top:16px}#pf-startup nav a{display:inline-flex;box-sizing:border-box;align-items:center;justify-content:center;min-height:44px;padding:5px 12px;color:#294c40;font-size:13px;text-underline-offset:4px;border-radius:10px;text-decoration:underline}#pf-startup a:focus-visible{outline:3px solid #dc683e;outline-offset:2px}#pf-startup noscript p{margin:8px 0 0;font-size:14px}html[data-pf-startup="waiting"] #pf-startup .pf-loading-person{animation:none}html[data-pf-startup="waiting"]     <script id="pf-startup-script">(()=>{const doc=document,root=doc.documentElement;if(root.dataset.pfStartup!=='pending')return;let done=false,timer;function ready(){const mounted=root.dataset.pfStartup==='ready'||doc.querySelector('.pf-entry[role="dialog"]');if(done||!mounted)return false;done=true;clearTimeout(timer);observer.disconnect();window.removeEventListener('error',failed,true);window.removeEventListener('unhandledrejection',failed);root.dataset.pfStartup='ready';doc.getElementById('pf-startup')?.remove();return true;}function failed(){if(ready()||done)return;const status=doc.getElementById('pf-startup-status');if(status)status.textContent='準備時間較久，或遊戲未能載入。你可以重新載入，或返回首頁。';root.dataset.pfStartup='waiting';}const observer=new MutationObserver(ready);observer.observe(root,{subtree:true,childList:true,attributes:true,attributeFilter:['data-pf-startup']});window.addEventListener('error',failed,true);window.addEventListener('unhandledrejection',failed);timer=setTimeout(failed,15000);ready();})();</script>
