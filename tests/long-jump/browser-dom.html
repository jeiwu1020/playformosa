<!doctype html><html lang="en"><meta charset="utf-8"><title>Long-jump scoped touch DOM regression</title><style>body{font:16px system-ui;background:#fff;color:#172c3b}iframe{width:390px;height:844px;border:1px solid}pre{white-space:pre-wrap}</style><h1>Long-jump scoped touch DOM regression</h1><p>This harness exercises shipped HTML/CSS and native DOM events; it is not physical iOS gesture or gameplay acceptance.</p><pre id="report">Running…</pre><iframe title="Actual long-jump candidate"></iframe><script type="module">
const iframe=document.querySelector('iframe'),report=document.querySelector('#report');
iframe.addEventListener('load',async()=>{
 const checks=[],failures=[],win=iframe.contentWindow,doc=iframe.contentDocument;
 const check=(name,fn)=>{try{fn();checks.push(name);}catch(error){failures.push({name,error:error.message});}};
 const assert=(condition,message)=>{if(!condition)throw Error(message);};
 const send=(element,type)=>{const event=new win.Event(type,{bubbles:true,cancelable:true});element.dispatchEvent(event);return event.defaultPrevented;};
 check('All live-main descendants, header UI text and buttons block CSS selection',()=>{for(const element of doc.querySelectorAll('main,main *,header h1,#sound-status,button,button *'))assert(win.getComputedStyle(element).userSelect==='none',element.outerHTML.slice(0,100));});
 check('Root touch-action is none, every nested limb label is pointer-transparent',()=>{assert(win.getComputedStyle(doc.querySelector('main')).touchAction==='none','main touch action');for(const element of doc.querySelectorAll('[data-limb] *'))assert(win.getComputedStyle(element).pointerEvents==='none','nested label hit target');});
 check('Native selection/contextmenu/drag and touch defaults are cancelled on every live descendant',()=>{for(const element of doc.querySelectorAll('main,main *'))for(const type of ['selectstart','contextmenu','dragstart','touchstart','touchmove','touchend'])assert(send(element,type),element.tagName+' '+type);});
 check('Header and dialog buttons suppress selection only, preserving touch/focus defaults',()=>{for(const element of doc.querySelectorAll('header button,.card button')){for(const type of ['selectstart','contextmenu','dragstart'])assert(send(element,type),element.id+' '+type);for(const type of ['touchstart','touchmove','touchend','focus'])assert(!send(element,type),element.id+' '+type);}});
 check('Dialog text, credits, links, share status keep native selection, drag and touch',()=>{for(const selector of ['#overlay','#card-text','.music-credits summary','.music-credits a','#share-status'])for(const type of ['selectstart','contextmenu','dragstart','touchstart','touchmove','touchend'])assert(!send(doc.querySelector(selector),type),selector+' '+type);assert(win.getComputedStyle(doc.querySelector('#overlay')).touchAction==='pan-y','dialog pan-y');assert(win.getComputedStyle(doc.querySelector('#share-status')).userSelect==='text','manual copy text');});
 check('Dynamic nested labels inherit protection and still bubble to game input observers',()=>{const child=doc.createElement('span');child.textContent='nested test label';doc.querySelector('[data-limb="2"] small').appendChild(child);let observed=0;doc.querySelector('main').addEventListener('touchstart',()=>observed++,{once:true});assert(send(child,'touchstart'),'nested touch not blocked');assert(observed===1,'propagation consumed');assert(win.getComputedStyle(child).userSelect==='none','dynamic selection');assert(win.getComputedStyle(child).pointerEvents==='none','dynamic hit target');child.remove();});
 check('Pointer cancellation, key and assistive click notifications remain uncancelled by surface guard',()=>{for(const type of ['pointercancel','lostpointercapture','keydown','keyup','click'])assert(!send(doc.querySelector('main'),type),type);});
 check('Credits disclosure remains keyboard-focusable and expandable',()=>{const summary=doc.querySelector('.music-credits summary');summary.focus();assert(doc.activeElement===summary,'summary focus');summary.click();assert(summary.parentElement.open,'credits expansion');});
 report.textContent=JSON.stringify({status:failures.length?'failed':'passed',checks,failures,webglAvailable:!!doc.querySelector('#scene canvas'),limits:['Synthetic native DOM events, not trusted touchscreen gestures.','Physical iOS callouts and native share sheet not tested.','Gameplay requires a WebGL-enabled browser; separate lifecycle/unit tests cover logic.']},null,2);
});
iframe.src='/games/long-jump/';
</script></html>
