<!doctype html><html lang="en"><meta charset="utf-8"><title>Phone portrait control lift QA</title><style>body{font:11px system-ui;background:#e7ece9;color:#172c3b;margin:12px}h1{margin:0 0 5px;font-size:16px}button{padding:4px;margin:2px;font-size:11px}#views{display:flex;gap:12px;align-items:flex-start}.view{flex:none}.crop{position:relative;height:180px;overflow:hidden}.crop::after{content:"";position:absolute;left:0;right:0;top:117.6px;border-top:1px dashed #e76f4b;pointer-events:none}.view h2{font-size:10px;margin:8px 0}iframe{transform:scale(.6);transform-origin:top left;display:block;border:0;background:#f4f1e9}pre{white-space:pre-wrap;background:white;padding:4px;margin:4px 0;max-width:1000px;max-height:35px;overflow:auto}#summary{margin:4px 0;color:#334b42}</style><h1>Phone portrait controls: before / candidate</h1><p id="summary">Bottom 300px detail; dashed line = old top. Layout QA only, not WebGL / physical iOS.</p><nav><button id="p375">375 × 667</button><button id="p390">390 × 844</button><button id="p430">430 × 932</button><button id="rotate">Rotation / desktop checks</button></nav><pre id="report" hidden>Loading…</pre><output id="completed-status"></output><script type="application/json" id="all-records"></script><div id="views"><section class="view"><h2>Before (published touch-guard base)</h2><div class="crop"><iframe id="before" title="Before controls"></iframe></div></section><section class="view"><h2>Candidate (new bottom = old top)</h2><div class="crop"><iframe id="after" title="Raised controls"></iframe></div></section></div><script type="module">
const before=document.querySelector('#before'),after=document.querySelector('#after'),report=document.querySelector('#report'),records=[];
function sized(frame,width,height){frame.parentElement.style.width=width*.6+'px';frame.style.marginTop=-(height-300)*.6+'px';frame.style.width=width+'px';frame.style.height=height+'px';}
function loaded(frame,url){return new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src=url;});}
sized(before,390,844);sized(after,390,844);
await Promise.all([loaded(before,'/qa-baseline-longjump/'),loaded(after,'/games/long-jump/')]);
const modules=await Promise.all([import('/qa-baseline-longjump/layout.mjs'),import('/games/long-jump/layout.mjs')]);let disposes=[];
function adapter(win,coarse){return{innerWidth:win.innerWidth,innerHeight:win.innerHeight,visualViewport:win.visualViewport,matchMedia:()=>({matches:coarse}),getComputedStyle:win.getComputedStyle.bind(win),requestAnimationFrame:win.requestAnimationFrame.bind(win),addEventListener:win.addEventListener.bind(win),removeEventListener:win.removeEventListener.bind(win)};}
const rect=el=>{const r=el.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,top:r.top,bottom:r.bottom};};
const inspect=frame=>{const doc=frame.contentDocument,win=frame.contentWindow;return{buttons:[...doc.querySelectorAll('[data-limb]')].map(el=>({limb:el.dataset.limb,...rect(el)})),arena:rect(doc.querySelector('.arena')),hud:rect(doc.querySelector('.world-hud')),stamina:rect(doc.querySelector('#air-guide')),lift:win.getComputedStyle(doc.documentElement).getPropertyValue('--controls-lift'),guard:win.getComputedStyle(doc.querySelector('main')).touchAction,webgl:!!doc.querySelector('#scene canvas')};};
async function run(width,height,coarse=true){
 disposes.forEach(fn=>fn());disposes=[];sized(before,width,height);sized(after,width,height);
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 for(const [i,frame]of [before,after].entries()){frame.contentDocument.querySelector('#overlay').close();disposes.push(modules[i].installViewportLayout(adapter(frame.contentWindow,coarse),frame.contentDocument));}
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 const old=inspect(before),next=inspect(after),lift=coarse&&width<640&&height>width?96:0,failures=[];
 for(let i=0;i<4;i++){const a=old.buttons[i],b=next.buttons[i];if(Math.abs((a.bottom-b.bottom)-lift)>.05)failures.push('wrong lift '+i);if(lift&&Math.abs(b.bottom-a.top)>.05)failures.push('boundary '+i);if(a.width!==b.width||a.height!==b.height||a.x!==b.x)failures.push('button sizing/side position changed '+i);}
 if(next.arena.top!==old.arena.top||Math.abs(old.arena.height-next.arena.height-lift)>.05)failures.push('arena region');
 if(next.hud.bottom>=next.arena.bottom||next.stamina.bottom>=next.buttons[0].top&&lift)failures.push('HUD overlaps controls');if(next.guard!=='none')failures.push('touch guard removed');
 const entry={width,height,pointer:coarse?'coarse':'fine',status:failures.length?'failed':'passed',failures,before:old,after:next};records.push(entry);report.textContent=JSON.stringify({current:entry,completed:records.map(({width,height,pointer,status})=>({width,height,pointer,status}))},null,2);document.querySelector('#all-records').textContent=JSON.stringify(records);
}
for(const [id,w,h]of[['p375',375,667],['p390',390,844],['p430',430,932]])document.querySelector('#'+id).onclick=()=>run(w,h);
document.querySelector('#rotate').onclick=async()=>{document.querySelector('#completed-status').textContent='running';await run(390,844);await run(844,390);await run(390,844);await run(1280,800,false);await run(390,844,false);await run(430,932);document.querySelector('#completed-status').textContent='rotation complete';};
await run(390,844);
</script></html>
