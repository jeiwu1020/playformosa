<!doctype html><html lang="en"><meta charset="utf-8"><title>Rotation recovery native DOM QA</title><style>body{font:11px system-ui;color:#172c3b;background:#e7ece9;margin:8px}h1{font-size:15px;margin:0 0 4px}button{font-size:11px;margin:2px;padding:4px}#wrap{width:220px;height:230px;overflow:hidden;float:left}iframe{border:0;transform:scale(.24);transform-origin:top left}pre{font:10px monospace;white-space:pre-wrap;max-height:200px;overflow:auto;margin:3px 0}#status{font-weight:bold}</style><h1>Actual game + native dialog; only WebGLRenderer is stubbed</h1><nav><button id="browser">Browser</button><button id="app">Standalone</button><button id="portrait">Portrait</button><button id="landscape">Landscape</button><button id="arm">Rotate during next hold</button><button id="inspect">Inspect</button><select id="size" aria-label="Viewport size"><option value="390,844">390×844</option><option value="375,667">375×667</option><option value="430,932">430×932</option><option value="844,390">844×390</option><option value="1280,800">1280×800</option></select></nav><div id="status">loading</div><div id="wrap"><iframe id="game" title="Actual native game controls"></iframe></div><pre id="summary"></pre><pre id="report"></pre><script type="application/json" id="records"></script><script type="module">
const frame=document.querySelector('#game'),report=document.querySelector('#report'),status=document.querySelector('#status'),records=[];const before=new URLSearchParams(location.search).has('baseline');let mode='standalone';
function rect(el){const r=el.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom};}
function inspect(label='inspect',persist=true){
 const win=frame.contentWindow,doc=frame.contentDocument,dialog=doc.querySelector('#overlay'),start=doc.querySelector('#start'),r=rect(start),hit=doc.elementFromPoint(r.x+r.width/2,r.y+r.height/2);const value={label,mode,viewport:[win.innerWidth,win.innerHeight],game:win.qaGame?.(),native:{...win.qaNative},dialog:{open:dialog.open,modal:dialog.matches(':modal'),start:r,hit:hit?.id||hit?.tagName,hitResume:hit===start||start.contains(hit)},controls:[...doc.querySelectorAll('[data-limb]')].map(b=>({limb:b.dataset.limb,...rect(b),pressed:b.getAttribute('aria-pressed'),focusVisible:b.matches(':focus-visible'),outline:win.getComputedStyle(b).outlineStyle})),arena:rect(doc.querySelector('.arena')),canvas:rect(doc.querySelector('#scene canvas')),stamina:rect(doc.querySelector('#air-guide')),lift:doc.documentElement.style.getPropertyValue('--controls-lift'),extension:doc.documentElement.style.getPropertyValue('--scene-extension')};
 document.querySelector('#summary').textContent=`${mode} ${value.viewport.join('×')} • lift ${value.lift}\ncontrols ${value.controls[0].y}–${value.controls[0].bottom} • arena bottom ${value.arena.bottom}\npaused ${value.game?.paused} • native hit Resume ${value.dialog.hitResume}\nheld ${value.game?.held} • pointer count ${value.game?.pointers.length}`;if(persist)records.push(value);report.textContent=JSON.stringify(value,null,2);document.querySelector('#records').textContent=JSON.stringify(records);return value;
}
function size(w,h){frame.style.width=w+'px';frame.style.height=h+'px';}
window.qaRotate=(w,h)=>{status.textContent='rotating';size(w,h);requestAnimationFrame(()=>{frame.contentWindow.dispatchEvent(new frame.contentWindow.Event('orientationchange'));setTimeout(()=>{inspect('rotation settled');status.textContent='rotation settled';},350);});};
async function load(next){mode=next;status.textContent='loading';size(390,844);await new Promise(resolve=>{frame.onload=resolve;frame.src=(before?'/qa-native-before/':'/qa-native-after/')+'?mode='+mode;});setTimeout(()=>{inspect('loaded');status.textContent='ready';},100);}
document.querySelector('#size').onchange=e=>qaRotate(...e.target.value.split(',').map(Number));document.querySelector('#browser').onclick=()=>load('browser');document.querySelector('#app').onclick=()=>load('standalone');document.querySelector('#portrait').onclick=()=>qaRotate(390,844);document.querySelector('#landscape').onclick=()=>qaRotate(844,390);document.querySelector('#arm').onclick=()=>{frame.contentWindow.qaNative.rotateNext=true;status.textContent='hold a limb now';};document.querySelector('#inspect').onclick=()=>{inspect();status.textContent='inspected';};await load(mode);setInterval(()=>{if(frame.contentWindow.qaGame)inspect('live',false);},150);
</script></html>
