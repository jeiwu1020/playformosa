<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真實高度景色 QA — 渲染標尺掃描，非操作成績</title><style>body{margin:0;background:#f5f1e8;color:#24434a;font:13px system-ui}nav{padding:7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}button{padding:5px}#scene{position:relative;width:min(100vw,1000px);height:550px;margin:auto}p{text-align:center;margin:6px}input{width:160px}</style><nav><strong>渲染 QA · 非手動通關</strong><button data-size="1000,550">桌面</button><button data-size="874,402">橫向</button><button data-size="390,600">窄直向</button><button data-h="49.54">50m</button><button data-h="95">95m</button><button data-h="135">135m</button><button data-h="331.5">331m</button><button data-h="508">508m</button><button data-h="634">634m</button><button data-h="829.8">830m</button><button data-h="2000">2km</button><button data-h="10000">10km</button><button data-h="20000">20km</button><button data-h="30000">30km</button><button data-h="100000">100km</button><button data-h="150000">150km</button><button id="up">掃描上升</button><button id="down">掃描下降</button><button id="stop">停止</button><button id="reset">重設</button><label>實際高度 <input id="alt" type="range" min="0" max="40" step=".001" value="9"></label><button data-weather="day">白天</button><button data-weather="sunset">夕陽</button><button data-weather="night">夜晚</button><button data-weather="rain">雨雲</button></nav><p id="status"></p><div id="scene"></div><script type="module">
import{fresh}from'./physics.mjs';import{createWorld}from'./render.mjs';import{sceneAltitude,heightAtSceneAltitude}from'./altitude.mjs';
const host=document.querySelector('#scene'),world=createWorld(host),slider=document.querySelector('#alt');let altitude=95,airTime=15,quality=.7,direction=0,last=performance.now();
function render(){const s=Object.assign(fresh(),{phase:'air',x:18.5,y:altitude+1,altitude,maxHeight:altitude,barHeight:altitude,airTime,t:airTime+5,rising:true,vy:30,plantQuality:quality,launchTime:3.2});world.render(s);slider.value=sceneAltitude(altitude);document.querySelector('#status').textContent=`實際高度樣本 ${altitude.toFixed(3)} m · 渲染掃描，非物理模擬或人類通關 · ${host.clientWidth}×${host.clientHeight} · ${world.software?'原場景 CPU fallback':'WebGL'}`;}
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{const[w,h]=b.dataset.size.split(',');host.style.width=w+'px';host.style.maxWidth='100vw';host.style.height=h+'px';world.resize();render();};
for(const b of document.querySelectorAll('[data-h]'))b.onclick=()=>{direction=0;altitude=+b.dataset.h;render();};for(const b of document.querySelectorAll('[data-weather]'))b.onclick=()=>{const mode=b.dataset.weather;airTime=mode==='day'?2:mode==='sunset'?45:mode==='night'?88:25;quality=mode==='rain'?.82:.7;render();};slider.oninput=()=>{direction=0;altitude=heightAtSceneAltitude(+slider.value);render();};document.querySelector('#up').onclick=()=>direction=1;document.querySelector('#down').onclick=()=>direction=-1;document.querySelector('#stop').onclick=()=>direction=0;document.querySelector('#reset').onclick=()=>{direction=0;altitude=0;airTime=2;render();};function tick(t){const dt=Math.min(.08,(t-last)/1000);last=t;if(direction){altitude=heightAtSceneAltitude(Math.max(0,Math.min(40,sceneAltitude(altitude)+direction*dt*.45)));render();}requestAnimationFrame(tick);}render();requestAnimationFrame(tick);
</script></html>
