<!doctype html><meta charset="utf-8"><title>Courtesy platform QA</title><style>body{margin:0;background:#dce4d8;font:14px system-ui}nav{padding:10px;background:white;position:sticky;top:0;z-index:2}#cover[src]{position:fixed;left:0;top:0;z-index:1000;max-width:100vw}iframe{border:0;display:block;background:#f6f2e6}input{width:65px}button{min-height:35px}pre{white-space:pre-wrap;max-width:1100px}</style><nav><label>Width <input id="w" value="390"></label> <label>Height <input id="h" value="844"></label> <button id="load">Load viewport</button> <button id="matrix">Run matrix</button> <button id="live">Run actual round</button> <button id="debug">Inspect timing</button> <button id="card">Download cover</button> <output id="status"></output></nav><iframe id="frame" title="Courtesy preview"></iframe><pre id="report"></pre><img id="cover" alt="Game cover capture"><script>
const $=id=>document.getElementById(id),frame=$('frame'),pause=ms=>new Promise(r=>setTimeout(r,ms));let errors=[];
async function wait(fn){for(let i=0;i<300;i++){if(fn())return;await pause(25);}throw Error('wait timeout');}
async function load(w=+$('w').value,h=+$('h').value){frame.style.width=w+'px';frame.style.height=h+'px';frame.src='/games/courtesy-contest/?localqa='+Date.now();await new Promise(r=>frame.onload=r);const win=frame.contentWindow;win.addEventListener('error',e=>errors.push(e.message));win.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));await wait(()=>win.document.querySelector('[data-pf-entry][open]'));let requests=[];const fetch=win.fetch.bind(win);win.fetch=(url,opts)=>{if(String(url).startsWith('/api/')){requests.push({url,body:opts?.body?JSON.parse(opts.body):null});return Promise.resolve(new win.Response('{}',{status:200}));}return fetch(url,opts);};const loop=win.courtesyGame.loop;loop.raf.stop();loop.raf.start(loop.step.bind(loop),true,1000/60);return{win,d:win.document,s:win.courtesyGame.scene.keys.Courtesy,requests};}
const rect=e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};
function measure(x,w,h,phase){const d=x.d,entry=d.querySelector('dialog[open]'),g=d.getElementById('game'),c=rect(g),toolbar=[...d.querySelectorAll('.pf-header nav button')].filter(e=>!e.hidden).map(e=>({...rect(e),text:e.textContent})),dialog=entry?rect(entry):null,title=rect(d.querySelector('.pf-studio-heading h1')),nav=rect(d.querySelector('.pf-header nav')),titleClear=title.w>=80&&title.h>0&&(title.bottom<=nav.y||title.y>=nav.bottom||title.right<=nav.x||title.x>=nav.right);return{w,h,phase,titleClear,overflow:d.documentElement.scrollWidth-w,canvas:c,toolbar,dialog,scrollHeight:entry?.scrollHeight,clientHeight:entry?.clientHeight,pass:titleClear&&d.documentElement.scrollWidth<=w&&toolbar.every(b=>b.w>=44&&b.h>=44&&b.x>=0&&b.right<=w)&&(!dialog||dialog.x>=0&&dialog.y>=0&&dialog.right<=w+.1&&dialog.bottom<=h+.1)};}
$('load').onclick=()=>load().then(()=>$('status').textContent='Loaded');
$('matrix').onclick=async()=>{const rows=[];try{for(const [w,h]of [[320,568],[390,844],[650,700],[651,700],[844,390],[1366,768],[683,384],[787,505],[1280,480]]){const x=await load(w,h);rows.push(measure(x,w,h,'entry'));x.d.querySelector('.pf-entry-start').click();await pause(150);rows.push(measure(x,w,h,'play'));const before=rect(x.d.querySelector('#game'));x.s.roundClock.start(x.win.performance.now()-11000);x.s.syncDeadline();await pause(100);const after=rect(x.d.querySelector('#game'));rows.push({w,h,phase:'clock-hidden',pass:x.d.querySelector('.time').classList.contains('timer-hidden')&&before.y===after.y&&before.h===after.h});x.d.querySelector('#toolbar-pause').click();const remaining=x.s.roundClock.remaining(x.win.performance.now());await pause(200);rows.push({...measure(x,w,h,'pause'),frozen:x.s.roundClock.remaining(x.win.performance.now())===remaining});x.d.querySelector('[data-pf-restart]').click();await pause(100);x.d.querySelector('#thanks').click();await wait(()=>x.d.querySelector('#result[open]'));await wait(()=>!x.d.querySelector('#share-image').disabled);rows.push(measure(x,w,h,'result'));const photo=x.d.querySelector('#result-photo');rows.push({w,h,phase:'result-snapshot',pass:photo.width>0&&photo.height>0,photo:[photo.width,photo.height],requests:x.requests});x.d.querySelector('#restart').click();await pause(100);rows.push({w,h,phase:'second-round',pass:x.s.phase==='play'&&x.s.count===0&&x.requests.length===3});$('status').textContent=rows.length+' checks';}const report={rows,passed:rows.filter(r=>r.pass).length,total:rows.length,errors};$('report').textContent=JSON.stringify(report,null,2);$('status').textContent='Done '+report.passed+'/'+report.total;}catch(e){$('report').textContent=JSON.stringify({rows,error:String(e),errors},null,2);$('status').textContent='Failed';}};
$('debug').onclick=async()=>{const x=await load();x.d.querySelector('.pf-entry-start').click();x.d.querySelector('#thanks').click();await pause(4000);const s=x.s;$('report').textContent=JSON.stringify({state:s.debugState(),hidden:x.d.hidden,loop:{running:s.game.loop.running,paused:s.game.loop.paused,time:s.game.loop.time,frame:s.game.loop.frame,delta:s.game.loop.delta},sys:{status:s.sys.settings.status,active:s.sys.isActive(),paused:s.sys.isPaused()},clock:{now:s.time.now,paused:s.time.paused,timeScale:s.time.timeScale,events:s.time._active.map(t=>({elapsed:t.elapsed,delay:t.delay,paused:t.paused,hasDispatched:t.hasDispatched}))}},null,2);};
$('live').onclick=async()=>{try{const x=await load(),out={};x.d.querySelector('.pf-entry-start').click();const samples=[];for(let i=0;i<12;i++){samples.push({second:i,clock:x.d.querySelector('#clock').textContent,rect:rect(x.d.querySelector('#game')),visible:!x.d.querySelector('.time').classList.contains('timer-hidden')});await pause(1000);}out.samples=samples;x.d.querySelector('#offer').click();await pause(1100);x.d.querySelector('#toolbar-pause').click();const remaining=x.s.roundClock.remaining(x.win.performance.now());await pause(1500);out.pauseFrozen=x.s.roundClock.remaining(x.win.performance.now())===remaining;x.d.querySelector('[data-pf-continue]').click();x.d.querySelector('#thanks').click();await wait(()=>x.d.querySelector('#result[open]'));out.result={count:x.s.count,seated:x.s.seated,title:x.d.querySelector('#result-title').textContent};out.requests=x.requests;out.errors=errors;$('report').textContent=JSON.stringify(out,null,2);$('status').textContent='Actual round done';}catch(e){$('report').textContent=String(e);}};
$('card').onclick=()=>{const win=frame.contentWindow;win.courtesyGame.events.once('postrender',()=>{$('cover').src=win.courtesyGame.canvas.toDataURL('image/png');$('status').textContent='Cover captured';});};load();
</script>
