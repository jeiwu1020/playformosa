<!doctype html><meta charset="utf-8"><title>Homepage grid regression</title><style>body{font:12px system-ui;margin:8px;background:#dce3e1}button{padding:6px}#views{display:flex;gap:10px}.view{flex:none}iframe{border:0;display:block;transform:scale(.6);transform-origin:top left}.viewport{overflow:hidden}h2{font-size:12px;margin:4px 0}#status{display:block;padding:6px}pre{white-space:pre-wrap}</style><nav><button id="p375">375 portrait</button><button id="p390">390 portrait</button><button id="p430">430 portrait</button><button id="matrix">All viewports</button></nav><output id="status">Loading</output><div id="views"><section class="view"><h2>Published baseline</h2><div class="viewport"><iframe id="before" title="Baseline homepage"></iframe></div></section><section class="view"><h2>Candidate (artwork retained)</h2><div class="viewport"><iframe id="after" title="Candidate homepage"></iframe></div></section></div><script type="application/json" id="records"></script><script type="module">
const before=document.querySelector('#before'),after=document.querySelector('#after'),records=[];
function size(f,w,h){f.style.width=w+'px';f.style.height=h+'px';f.parentElement.style.width=w*.6+'px';f.parentElement.style.height=h*.6+'px';}
function load(f,url){return new Promise(resolve=>{f.addEventListener('load',resolve,{once:true});f.src=url;});}
const rect=e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom};};
function inspect(f){const d=f.contentDocument,w=f.contentWindow,selectors=['.site-header','.wordmark','.hero','.hero h1','.hero-subtitle','.hero-actions','.hero-art','.hero-art img','.comic-sticker','.hero-caption','.series'];return{width:w.innerWidth,clientWidth:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,rects:Object.fromEntries(selectors.map(s=>[s,rect(d.querySelector(s))])),imageLoaded:d.querySelector('.hero-art img').complete&&d.querySelector('.hero-art img').naturalWidth===1536,overflowX:w.getComputedStyle(d.documentElement).overflowX};}
for(const f of [before,after])size(f,390,844);await Promise.all([load(before,'/qa-home-baseline/'),load(after,'/')]);
async function run(width,height){for(const f of [before,after])size(f,width,height);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const old=inspect(before),next=inspect(after),failures=[],baselineFailures=[];
 function mobileChecks(v){const a=v.rects['.hero-art'],h=v.rects['.hero'],im=v.rects['.hero-art img'],fails=[];if(Math.abs(a.width-h.width)>.2)fails.push('art width differs from grid');if(Math.abs(a.height-a.width/1.25)>.2)fails.push('art ratio is content-driven');if(v.scrollWidth>v.clientWidth+1)fails.push('document horizontal overflow');if(!v.imageLoaded)fails.push('image missing');for(const s of ['.wordmark','.hero h1','.hero-art','.hero-art img','.comic-sticker','.hero-caption']){const b=v.rects[s];if(b.x<-.5||b.right>v.clientWidth+.5)fails.push(s+' clipped horizontally');}if(im.y<a.y-.5||im.bottom>a.bottom+.5)fails.push('image escapes ratio box');return fails;}
 if(width<=640){failures.push(...mobileChecks(next));baselineFailures.push(...mobileChecks(old));}else for(const [s,a] of Object.entries(old.rects))for(const k of ['x','y','width','height'])if(Math.abs(a[k]-next.rects[s][k])>.1)failures.push('nonmobile changed '+s+' '+k);
 const entry={width,height,status:failures.length?'failed':'passed',failures,baselineFailures,before:old,after:next};records.push(entry);document.querySelector('#records').textContent=JSON.stringify(records);document.querySelector('#status').textContent=`${width} × ${height}: ${entry.status}; baseline issues ${baselineFailures.length}`;return entry;}
for(const [id,w,h] of [['p375',375,667],['p390',390,844],['p430',430,932]])document.querySelector('#'+id).onclick=()=>run(w,h);
document.querySelector('#matrix').onclick=async()=>{for(const [w,h] of [[375,667],[390,844],[430,932],[844,390],[1280,800],[390,844]])await run(w,h);document.querySelector('#status').textContent='Matrix complete: '+records.filter(x=>x.status==='failed').length+' candidate failures';};await run(390,844);
</script>
